# companies.yaml — curated board list (PLAN.md §6)
#
# Seeded by mining the apply URLs in the two zapplyjobs new-grad README tables,
# then hand-extended with the Tier 1 / Tier 2 companies named in PLAN.md §1 and
# the geography anchors in §4 (Draper, MITRE, Analog Devices, Qorvo, Wolfspeed,
# Teradyne, Infineon, Raytheon, BAE, HPE, Lenovo, Red Hat, Motorola, Zebra...).
#
# Every entry under `boards:` was PROBED LIVE on 2026-08-18 and returned at
# least one posting; `postings_at_validation` records how many. Entries under
# `workday_boards:` carry real mined tenant|shard|site triples but are marked
# valid: false because sources/workday.py is a deliberate stub — see that file
# for what implementing it requires.
#
# Fields
#   company  display name used in the email
#   ats      greenhouse | lever | ashby | workday | smartrecruiters
#   slug     board identifier; for workday it is "tenant|shard|site"
#   track    software | hardware | both  (which resume to match against)
#   tier     1 = FAANG+ and equivalent, 2 = strong but less competitive
#   metros   observed/expected metros — informational; the real geography gate
#            is the per-posting location filter in pipeline/geo.py
#   valid    whether a fetcher exists AND the board answered at probe time
#
# Totals: 160 live boards + 148 stubbed Workday = 308 entries.

