# Daily Job Agent — runtime configuration
# Everything cost-relevant lives here so it can be tuned without touching code.

owner:
  name: Charles Lepine
  email: clepine050@gmail.com
  graduation: 2026-12
  citizenship: US
  clearance_eligible: true

model:
  # Deliberate choice: Sonnet 5, not Opus. See README "Cost model".
  id: claude-sonnet-5
  # Thinking is ON BY DEFAULT on Sonnet 5. We disable it explicitly — the one
  # remaining LLM stage is bounded scoring, not deep reasoning, and thinking
  # tokens bill as output at 5x the input rate.
  thinking: disabled          # disabled | adaptive
  effort: low                 # low | medium | high | xhigh | max
  max_tokens_score: 1200
  max_tokens_tailor: 2500

budget:
  # HARD per-run ceiling in USD. The run aborts BEFORE any call that would
  # push estimated spend past this. Protects against a filter-layer bug
  # dumping 500 jobs into the model overnight.
  max_usd_per_run: 0.10
  # Sonnet 5 list pricing, USD per 1M tokens. Update if pricing changes.
  # (An introductory rate of $2/$10 ran through 2026-08-31; we estimate at the
  # standard rate so the ceiling is conservative, never optimistic.)
  price_input_per_mtok: 3.00
  price_output_per_mtok: 15.00
  price_cache_write_per_mtok: 3.75    # 1.25x input, 5-minute TTL
  price_cache_read_per_mtok: 0.30     # 0.10x input
  usage_log: out/usage.jsonl

limits:
  # Cheap local BM25 pre-rank keeps this many per track before LLM scoring.
  max_jobs_to_prerank: 40
  # Ceiling on how many NEVER-SCORED jobs get sent to the model in one run.
  # Steady state is ~10-15; the cap stops a backlog or a filter bug from
  # turning one run into a large bill.
  max_new_scores_per_run: 20
  # Jobs per scoring request. Batching amortizes the cached resume prefix.
  score_batch_size: 8
  # Compressed job descriptions are hard-truncated to this many characters
  # before ANY of them reaches the model.
  jd_max_chars: 1600
  # Drop postings older than this. Lever in particular reports the req's
  # original createdAt, which surfaces reqs open for literally years — a
  # 1,400-day-old posting is not a lead. Postings with NO date are kept
  # (unknown age is not the same as old age) and simply age-stamped "unknown".
  # Owner's call, 2026-08-18: only genuinely fresh reqs are worth his time.
  # Measured against the pool that day, a 7-day window holds 119 software and
  # 67 hardware postings already past the filters — about 17 and 10 arriving
  # per day against the 5+5 consumed, so it runs a surplus in peak season.
  #
  # SEASONAL RISK: that inflow was measured in August, at the top of new-grad
  # hiring. If the email starts coming up short in the spring, this is the
  # first number to raise (14 or 30) — run.py will say plainly whether the
  # cause is an empty pool or an unscored backlog, so don't guess.
  max_posting_age_days: 7
  # ...EXCEPT in the five primary metros, where 7 days is not a tight filter,
  # it is a blackout. Owner's call 2026-08-19. Measured that morning, the same
  # 770-posting pool held 392 Bay Area and 106 Seattle roles against 3
  # Charlotte and 1 RTP — abundant exactly where he is least likely to move,
  # empty in the two markets he lives near.
  #
  # The obvious explanation was tested and is wrong. Eighteen extra boards, all
  # probed live and answering (Truist, Duke Energy, TIAA, Epic Games, Pendo,
  # Bandwidth, SAS, Toast, Klaviyo, Cognex, Marvell, Cadence and others) add
  # FOUR postings inside 7 days and FIFTY-THREE with no age limit. Epic Games,
  # Bandwidth and Pendo each have RTP new-grad engineering roles 13-29 days
  # old. Those are open reqs, and the cutoff was discarding them.
  #
  # This does NOT loosen the original decision, it localizes it: fresh-only
  # still applies everywhere supply justifies it. If the email starts filling
  # with cold primary-metro reqs, lower this — not max_posting_age_days.
  max_posting_age_days_primary: 30
  # Diversity guard: at most this many slots per company per track, so one
  # company with a big board cannot take the whole email.
  max_per_company: 2
  # The backlog counterpart to max_posting_age_days. A posting is filtered on
  # age when it ARRIVES, but it can then sit in the scored backlog for weeks
  # because better matches kept outranking it, and nothing re-checked it.
  # Measured 2026-08-19: the pool held scored, sendable postings 124, 110, 97,
  # 77 and 74 days old, and the 2026-08-18 hardware email sent the 74-day-old
  # one. A four-month-old req is not a lead.
  #
  # 30, not 7. The ingest window is deliberately tight because it governs what
  # is worth PAYING to score; this one governs what is still worth applying to,
  # and a month-old posting often is. Raising it re-admits cold reqs; lowering
  # it toward 7 shrinks the backlog the email draws on in a slow week.
  max_backlog_age_days: 30

email:
  subject_prefix: "Daily Job Matches"
  per_track: 5
  tier1_quota: 2                # 2 from Tier 1 + 3 from Tier 2, per PLAN §1
  tier2_quota: 3
  # A Tier-1 slot is a PREFERENCE, not an obligation. Without this floor the
  # quota forces prestige over fit: on 2026-08-18 a Waymo ML ASIC role scoring
  # 30 (its own rationale said the owner lacks the tapeout experience) took a
  # slot from a Draper role scoring 50, and an Anduril role scoring 45
  # displaced two roles scoring 60. Below this score, backfill from Tier 2.
  tier1_min_fit: 50
  # Global floor: never send a posting the model itself called a poor match.
  # score.py calibrates 0-39 as "poor match, do not apply", so this is that
  # calibration enforced rather than merely printed. Before it existed the
  # email always sent five per track whether or not five were worth sending —
  # on 2026-08-18 the hardware list ended with a Waymo ML ASIC role at 30/100
  # whose own rationale said the owner lacks the tapeout experience, and a run
  # later that evening sent roles at 20, 30 and 35.
  #
  # This makes SHORT lists normal and correct. The email says how many were
  # held back and why, so a four-role day is never confusable with a break.
  min_fit: 40

geography:
  primary_bonus: 15
  secondary_penalty: -5

fetch:
  timeout_seconds: 25
  max_concurrency: 8
  retries: 2
  user_agent: "job-agent/1.0 (+https://github.com/clepine/job-agent)"
  # Workday only. Its CxS endpoint hard-caps a page at 20 postings (limit: 21
  # returns HTTP 400), so a large board costs one request per 20 postings.
  # Results come back strictly newest-first, so the fetcher normally stops as
  # soon as a whole page is older than limits.max_posting_age_days; this is the
  # backstop for when that cutoff is unset or a tenant ignores the sort.
  #
  # 60, not 25. Measured 2026-08-18 against the 7-day window: RTX needs 58
  # pages to reach the cutoff, Northrop Grumman 40, Thermo Fisher 39. At 25
  # the cap fired FIRST on all three, silently truncating the defense tier to
  # its newest 500 postings and dropping 3-7-day-old reqs — the exact failure
  # mode where the source looks like it works and quietly under-returns.
  # Raising it to 60 cost ~60s of wall clock across all 130 boards (a full run
  # went 2m37s -> 3m36s), because every ordinary board still stops early
  # (Micron 19 pages, Draper 11). It immediately recovered an RTX "Electrical
  # Engineer I - Test Solutions" in Boston that the 25-page cap was dropping.
  #
  # One known outlier: CVS Health posts so heavily that even 60 pages stays
  # inside a single day. It is capped, and that is fine — it is a pharmacy
  # chain, not a target employer.
  # 250, raised from 60 on 2026-08-19 when limits.max_posting_age_days_primary
  # widened the FETCH cutoff from 7 days to 30. Measured that day against live
  # boards, pages needed to reach the cutoff:
  #
  #                       7 days      30 days
  #     RTX                  ~50         ~223
  #     Northrop Grumman     ~35         ~185
  #     Draper                 4          ~11
  #
  # At 60 the cap would have fired first on RTX and Northrop and silently
  # truncated them back to roughly a 7-day window — so the primary-metro
  # setting would have looked applied while quietly doing nothing for the two
  # defense employers where the owner's clearance eligibility matters most.
  #
  # Gating the wider cutoff per-board on companies.yaml `metros` was considered
  # and rejected: Northrop Grumman's metros list is EMPTY, so the gate would
  # have kept exactly the wrong board on the narrow window. A hand-maintained
  # tag is not a safe input to a correctness decision.
  workday_max_pages: 250
  # Pages requested concurrently per board, after page 0. Workday paging is the
  # dominant cost of a run and it is pure latency — 223 sequential round-trips
  # for RTX. Measured 2026-08-19 at the 30-day cutoff, a full 290-board fetch
  # took 52 MINUTES sequentially, past the workflow's timeout.
  #
  # Page 0 is deliberately never waved: a dead tenant fails on its first
  # request, and 18 boards in companies.yaml are dead.
  #
  # Total in-flight requests are this times fetch.max_concurrency (6 x 8 = 48).
  workday_page_wave: 6

paths:
  # Local working store. Gitignored — see state/ below.
  db: state.db
  # Committed, diff-friendly ledger. This is the real persisted state.
  state: state/seen_jobs.json
  out_dir: out
  companies: companies.yaml
  resume_sw: resume/master_sw.yaml
  resume_hw: resume/master_hw.yaml
